<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1학년 3반 학급비</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2030;--sub:#7a8296;--pri:#3b6cff;--pri2:#7b5cff;--ok:#1fb67a;--bd:#e6e9f2;--sh:0 20px 50px rgba(40,60,120,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2f;--tx:#eef0f8;--sub:#8b93ab;--bd:#262b44;--sh:0 20px 50px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2f;--tx:#eef0f8;--sub:#8b93ab;--bd:#262b44;--sh:0 20px 50px rgba(0,0,0,.4);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:float 14s ease-in-out infinite}
.b1{width:320px;height:320px;background:var(--pri);top:-80px;left:-80px}
.b2{width:280px;height:280px;background:var(--pri2);bottom:-70px;right:-60px;animation-delay:-6s}
@keyframes float{50%{transform:translate(40px,30px) scale(1.1)}}
main{position:relative;z-index:1;width:100%;max-width:460px;text-align:center;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px;box-shadow:var(--sh);padding:40px 28px 28px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--pri);background:rgba(59,108,255,.12);padding:6px 14px;border-radius:99px}
h1{font-size:18px;margin:16px 0 4px}.label{color:var(--sub);font-size:14px}
.amount{font-size:clamp(40px,12vw,56px);font-weight:800;margin:14px 0 6px;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.amount.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.12)}}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,182,122,.5)}100%{box-shadow:0 0 0 10px rgba(31,182,122,0)}}
button{font:inherit;cursor:pointer;border:0;transition:transform .2s,box-shadow .3s}
.donate{margin-top:28px;width:100%;padding:17px;border-radius:18px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 10px 24px rgba(59,108,255,.35)}
.donate:hover{transform:translateY(-2px)}.donate:active{transform:scale(.97)}
.log{margin-top:22px;text-align:left;font-size:14px}
.log div{display:flex;justify-content:space-between;padding:10px 4px;border-top:1px solid var(--bd);animation:rise .5s both}.log b{color:var(--ok)}
.wishes{margin-top:26px;text-align:left}.wishes h3{font-size:16px;margin-bottom:4px}
.wf{display:flex;gap:8px;margin:10px 0 14px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.wf button{padding:0 16px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700}
.w{background:var(--bg);border-radius:16px;padding:14px;margin-bottom:10px;animation:rise .5s both}.w p{font-size:15px;line-height:1.5;word-break:break-word}
.vr{display:flex;gap:8px;margin-top:10px}
.vb{flex:1;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-size:13px;font-weight:600}
.vb:active{transform:scale(.95)}.vb.on.y{background:var(--ok);border-color:var(--ok);color:#fff}.vb.on.n{background:#e5484d;border-color:#e5484d;color:#fff}
.badge{font-size:12px;font-weight:700;color:var(--ok);margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(10,14,30,.5);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:26px;padding:28px 24px;transform:translateY(40px) scale(.96);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);text-align:left}
.ov.on .sheet{transform:none}
@media(min-width:600px){.ov{align-items:center}}
.acc{margin:18px 0;padding:16px;border-radius:16px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc small{color:var(--sub);display:block;font-size:12px}.acc strong{font-size:17px}
.copy{padding:9px 14px;border-radius:12px;background:var(--pri);color:#fff;font-size:13px;font-weight:600}
.note{font-size:13px;color:var(--sub);line-height:1.6}
.close{margin-top:16px;width:100%;padding:14px;border-radius:14px;background:var(--bg);color:var(--tx);font-weight:600}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translate(-50%,-90px);background:var(--ok);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;transition:transform .5s cubic-bezier(.2,1.4,.4,1);z-index:9}
.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body,.card,.w,.acc{transition:background .4s,color .4s,border-color .4s}
.tbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:6;width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-size:20px;line-height:1}
.tbtn:hover{transform:rotate(18deg) scale(1.08)}.tbtn:active{transform:scale(.9)}
.sheet{max-height:88vh;overflow:auto}
.adminlink{margin-top:18px;background:none;color:var(--sub);font-size:12px;text-decoration:underline}
.req{display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;background:var(--bg);margin-bottom:8px;font-size:15px}
.req span{flex:1;word-break:break-all}.req button{padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px}
.req .ok{background:var(--ok);color:#fff}.req .no{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="toast" id="toast"></div>
<button class="tbtn" id="themeBtn" aria-label="화이트/블랙 테마 바꾸기"></button>
<main><div class="card">
  <span class="tag">1학년 3반</span><h1>학급비</h1>
  <div class="label">지금 쓸 수 있는 금액</div>
  <div class="amount" id="amt">50,000원</div>
  <div class="live"><span class="dot"></span><span id="status">연결 중…</span></div>
  <button class="donate" id="open">💝 기부하기</button>
  <div class="log" id="log"></div>
  <section class="wishes"><h3>💡 이 돈으로 하고 싶은 것</h3>
    <div class="label">의견을 올리고 동의 여부를 눌러주세요. 모두에게 바로 보여요.</div>
    <div class="wf"><input id="wt" maxlength="80" placeholder="예: 학급 간식 파티"><button id="wb">올리기</button></div>
    <div id="wl"></div></section>
  <button class="adminlink" id="adminLink">관리자</button>
</div></main>

<div class="ov" id="ov"><div class="sheet">
  <h2>학급비 기부하기</h2>
  <p class="note" style="margin-top:6px">아래 계좌로 입금한 뒤, 입금 신청을 해주세요.</p>
  <div class="acc"><div><small>토스뱅크</small><strong>1908-8917-9072</strong></div><button class="copy" id="copy">복사</button></div>
  <p class="note" style="margin-bottom:8px">입금하셨다면 아래에 신청해 주세요. 관리자가 확인하면 모두의 화면에 바로 반영돼요.</p>
  <input id="rqName" maxlength="10" placeholder="입금자 이름">
  <input id="rqAmt" type="number" inputmode="numeric" placeholder="입금한 금액 (원)" style="margin-top:8px">
  <button class="donate" id="rqBtn" style="margin-top:12px;padding:14px;font-size:16px">입금했어요</button>
  <button class="close" id="close">닫기</button>
</div></div>

<div class="ov" id="aov"><div class="sheet">
  <h2>관리자: 입금 승인</h2>
  <p class="note" style="margin:6px 0 12px">토스뱅크 앱에서 입금을 확인한 뒤 승인해 주세요.</p>
  <div id="alist"></div>
  <p class="note" style="margin-top:14px">직접 충전</p>
  <div class="wf"><input id="mName" placeholder="이름" maxlength="10"><input id="mAmt" type="number" inputmode="numeric" placeholder="금액"><button id="mBtn">충전</button></div>
  <button class="close" id="aclose">닫기</button>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// Firebase 콘솔에서 복사한 웹앱 설정을 여기에 붙여넣으세요 (README 참고)
const firebaseConfig={
  apiKey:"AIzaSyAzqoM25Mt0mJUqJKaYYLNnoxBsPkXd2kQ",
  authDomain:"moneymanger-5ca45.firebaseapp.com",
  projectId:"moneymanger-5ca45",
  storageBucket:"moneymanger-5ca45.firebasestorage.app",
  messagingSenderId:"90319062580",
  appId:"1:90319062580:web:e0beb6ec43cd43b1a26c61"
};

const $=id=>document.getElementById(id),won=n=>n.toLocaleString("ko-KR")+"원";
let shown=50000,balance=50000,first=true,uid=null,wishes=[],votes={};
(function(){
  const root=document.documentElement,btn=document.getElementById("themeBtn");
  let t=null;try{t=localStorage.getItem("theme")}catch(e){}
  if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  const apply=x=>{root.dataset.theme=x;btn.textContent=x==="dark"?"☀️":"🌙";btn.title=x==="dark"?"화이트로 보기":"블랙으로 보기"};
  apply(t);
  btn.onclick=()=>{t=t==="dark"?"light":"dark";apply(t);try{localStorage.setItem("theme",t)}catch(e){}};
})();
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2800)}
function countTo(to){const f=shown,t0=performance.now();(function s(t){const p=Math.min((t-t0)/900,1);shown=Math.round(f+(to-f)*(1-Math.pow(1-p,3)));$("amt").textContent=won(shown);if(p<1)requestAnimationFrame(s)})(t0);
  if(to!==f){const a=$("amt");a.classList.remove("pop");void a.offsetWidth;a.classList.add("pop")}}
$("open").onclick=()=>$("ov").classList.add("on");
$("close").onclick=()=>$("ov").classList.remove("on");
$("ov").onclick=e=>{if(e.target.id==="ov")$("ov").classList.remove("on")};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText("1908-8917-9072");toast("계좌번호를 복사했어요")}catch(e){toast("길게 눌러 복사해 주세요")}};

if(!firebaseConfig.projectId){$("status").textContent="Firebase 설정 필요 (README 참고)"}
else{
  firebase.initializeApp(firebaseConfig);
  const db=firebase.firestore();
  firebase.auth().signInAnonymously().catch(()=>toast("연결에 실패했어요. 새로고침해 주세요"));
  firebase.auth().onAuthStateChanged(u=>{if(u){uid=u.uid;$("status").textContent="실시간 반영 중"}});
  db.doc("fund/state").onSnapshot(s=>{
    const d=s.exists?s.data():{balance:50000,log:[]};
    if(!first&&d.balance>balance)toast("🎉 "+won(d.balance-balance)+" 충전됐어요!");
    balance=d.balance;first=false;countTo(balance);
    $("log").textContent="";
    (d.log||[]).slice(0,4).forEach(l=>{const r=document.createElement("div"),a=document.createElement("span"),b=document.createElement("b");a.textContent=l.name||"익명";b.textContent="+"+won(l.amount);r.append(a,b);$("log").append(r)});
  });
  db.collection("wishes").orderBy("at","desc").onSnapshot(s=>{wishes=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
  db.collection("votes").onSnapshot(s=>{votes={};s.docs.forEach(d=>{const v=d.data();(votes[v.wish]=votes[v.wish]||{})[v.uid]=v.v});draw()});
  $("wb").onclick=async()=>{const t=$("wt").value.trim();if(!t||!uid)return;
    try{await db.collection("wishes").add({text:t,at:Date.now()});$("wt").value=""}catch(e){toast("올리기 실패")}};
  window.vote=async(id,v)=>{if(!uid)return;
    try{await db.doc("votes/"+id+"_"+uid).set({wish:id,uid,v})}catch(e){toast("투표 저장 실패")}};

  // ---- 입금 신청 / 관리자 승인 ----
  const ADMIN_EMAILS=["teletobidonghyun@gmail.com","nibrivalsclan@gmail.com","k.h.y.sty13@gmail.com"]; // 승인할 수 있는 구글 계정 (firestore.rules와 같게)
  const auth=firebase.auth();let isAdmin=false,unsubReq=null;
  const chk=u=>!!(u&&u.email&&ADMIN_EMAILS.includes(u.email));
  auth.onAuthStateChanged(u=>{isAdmin=chk(u)});
  $("rqBtn").onclick=async()=>{
    const name=$("rqName").value.trim(),amount=parseInt($("rqAmt").value,10);
    if(!name||!(amount>=100)||amount>1000000)return toast("이름과 금액을 확인해 주세요");
    if(!uid)return toast("연결 중이에요. 잠시 후 다시 눌러주세요");
    try{await db.collection("requests").add({name,amount,at:Date.now(),status:"pending",uid});
      $("rqName").value="";$("rqAmt").value="";$("ov").classList.remove("on");toast("신청했어요! 관리자가 확인하면 반영돼요")}
    catch(e){toast("신청에 실패했어요")}
  };
  async function charge(name,amount,reqId){
    const fund=db.doc("fund/state"),rq=reqId?db.doc("requests/"+reqId):null;
    await db.runTransaction(async t=>{
      const f=await t.get(fund);
      if(rq){const r=await t.get(rq);if(!r.exists||r.data().status!=="pending")throw new Error("done")}
      const d=f.exists?f.data():{balance:50000,log:[]};
      t.set(fund,{balance:d.balance+amount,log:[{name,amount,at:Date.now()},...(d.log||[])].slice(0,30)});
      if(rq)t.update(rq,{status:"approved",by:auth.currentUser.email,decidedAt:Date.now()});
    });
  }
  function openAdmin(){
    $("aov").classList.add("on");
    if(unsubReq)unsubReq();
    unsubReq=db.collection("requests").where("status","==","pending").onSnapshot(s=>{
      const box=$("alist");box.textContent="";
      const items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);
      if(!items.length){const n=document.createElement("div");n.className="label";n.textContent="대기 중인 신청이 없어요";box.append(n);return}
      items.forEach(r=>{
        const row=document.createElement("div");row.className="req";
        const t=document.createElement("span");t.textContent=r.name+" · "+won(r.amount);
        const ok=document.createElement("button");ok.className="ok";ok.textContent="승인";
        ok.onclick=async()=>{ok.disabled=true;try{await charge(r.name,r.amount,r.id)}catch(e){toast("이미 처리됐거나 실패했어요")}};
        const no=document.createElement("button");no.className="no";no.textContent="거절";
        no.onclick=async()=>{try{await db.doc("requests/"+r.id).update({status:"rejected",by:auth.currentUser.email,decidedAt:Date.now()})}catch(e){toast("실패했어요")}};
        row.append(t,ok,no);box.append(row);
      });
    },()=>toast("권한이 없어요"));
  }
  $("adminLink").onclick=async()=>{
    if(!auth.currentUser||!auth.currentUser.email){
      const prov=new firebase.auth.GoogleAuthProvider();
      try{await auth.signInWithPopup(prov)}
      catch(e){
        if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")return auth.signInWithRedirect(prov);
        return toast("로그인 실패: "+(e.code||e.message));
      }
    }
    isAdmin=chk(auth.currentUser);
    if(isAdmin)openAdmin();else toast("관리자만 들어갈 수 있어요");
  };
  auth.getRedirectResult().then(r=>{if(r&&r.user&&chk(r.user)){isAdmin=true;openAdmin()}}).catch(e=>{if(e&&e.code)toast("로그인 실패: "+e.code)});
  $("aclose").onclick=()=>$("aov").classList.remove("on");
  $("aov").onclick=e=>{if(e.target.id==="aov")$("aov").classList.remove("on")};
  $("mBtn").onclick=async()=>{
    const name=$("mName").value.trim()||"직접 충전",amount=parseInt($("mAmt").value,10);
    if(!(amount>0))return toast("금액을 확인해 주세요");
    try{await charge(name,amount,null);$("mName").value="";$("mAmt").value=""}catch(e){toast("충전에 실패했어요")}
  };
}
function draw(){
  const box=$("wl");box.textContent="";
  if(!wishes.length){const n=document.createElement("div");n.className="label";n.textContent="아직 의견이 없어요. 첫 의견을 올려보세요!";box.append(n);return}
  wishes.forEach(w=>{
    const vs=votes[w.id]||{},V=Object.values(vs),ys=V.filter(x=>x===1).length,ns=V.filter(x=>x===-1).length,mine=uid?vs[uid]:0;
    const el=document.createElement("div");el.className="w";
    const p=document.createElement("p");p.textContent=w.text;el.append(p);
    const r=document.createElement("div");r.className="vr";
    [[1,"👍 동의","y",ys],[-1,"👎 동의하지 않음","n",ns]].forEach(([v,t,c,n])=>{
      const b=document.createElement("button");b.className="vb "+c+(mine===v?" on":"");b.textContent=t+" "+n;
      b.onclick=()=>vote(w.id,mine===v?0:v);r.append(b)});
    el.append(r);
    if(ys>=3&&ns===0){const g=document.createElement("div");g.className="badge";g.textContent="✅ 모두 동의했어요";el.append(g)}
    box.append(el)});
}
draw();
</script>
</body>
</html>
